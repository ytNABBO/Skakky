<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skakky - Chess</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <h1>Skakky</h1>
    <p id="status" role="status"></p>
    <div id="board" role="group" aria-label="Chessboard"></div>
    <p id="turn" role="status" tabindex="-1">White to move</p>
    <dialog id="promotion" aria-labelledby="promotion-title">
        <h2 id="promotion-title">Promote pawn</h2>
        <form method="dialog">
            <button value="q" autofocus>Queen</button>
            <button value="r">Rook</button>
            <button value="b">Bishop</button>
            <button value="n">Knight</button>
            <button value="">Cancel</button>
        </form>
    </dialog>
</body>
</html>
